# ==============================================================================
# CALL CENTER — Apache Ters Vekil (VirtualHost) Yapılandırması
# ==============================================================================
# Dosya Konumu: /etc/apache2/sites-available/callcenter.conf
#
# DİKKAT: Mevcut Apache yapılandırmalarına dokunulmaz.
# Test: apache2ctl configtest
# Reload: systemctl reload apache2
# ==============================================================================

<VirtualHost *:80>
    ServerName arama.example.com
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName arama.example.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/arama.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/arama.example.com/privkey.pem

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    ProxyPass / http://127.0.0.1:3100/
    ProxyPassReverse / http://127.0.0.1:3100/
</VirtualHost>
