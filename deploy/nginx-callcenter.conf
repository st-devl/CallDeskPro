# ==============================================================================
# CALL CENTER — Nginx Ters Vekil (Reverse Proxy) Yapılandırması
# ==============================================================================
# Dosya Konumu: /etc/nginx/sites-available/callcenter.conf
# Sembolik Bağlantı: /etc/nginx/sites-enabled/callcenter.conf
#
# DİKKAT: Mevcut Nginx dosyalarına dokunulmaz; yalnızca bu yeni dosya eklenir.
# Uygulamadan önce test edilir: nginx -t
# Yalnızca reload yapılır (restart yasak): systemctl reload nginx
# ==============================================================================

# HTTP -> HTTPS Yönlendirmesi
server {
    listen 80;
    listen [::]:80;
    server_name arama.example.com; # Kendi alt alan adınızla değiştiriniz

    # Certbot ACME doğrulaması
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Sunucu Bloğu
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name arama.example.com; # Kendi alt alan adınızla değiştiriniz

    # SSL Sertifika Yolları (Certbot ile üretilen)
    ssl_certificate /etc/letsencrypt/live/arama.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arama.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Güvenlik Başlıkları
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # Excel/CSV içe aktarma için maksimum gövde boyutu
    client_max_body_size 12M;

    # Fastify Yerel Uygulamasına Yönlendirme (Port 3100)
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Zaman aşımları
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
