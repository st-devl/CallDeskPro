# ==============================================================================
# CALL CENTER — Nginx Ters Vekil (Reverse Proxy) Yapılandırması
# ==============================================================================
# Dosya Konumu: /etc/nginx/sites-available/callcenter.conf
# Sembolik Bağlantı: /etc/nginx/sites-enabled/callcenter.conf
#
# DİKKAT: Mevcut Nginx dosyalarına dokunulmaz; yalnızca bu yeni dosya eklenir.
# Uygulamadan önce test edilir: nginx -t
# Yalnızca reload yapılır (restart yasak): systemctl reload nginx
#
# SSL: Bu dosya bilinçli olarak yalnızca HTTP (80) ile başlar. Sertifika henüz
# yokken "nginx -t" hata vermesin diye SSL satırları burada yer almaz.
# "certbot --nginx -d <alan-adi>" komutu sertifikayı alır, bu bloğa 443/SSL
# ayarlarını kendisi ekler ve HTTP -> HTTPS yönlendirmesini kurar.
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name arama.example.com; # Kendi alt alan adınızla değiştiriniz

    # Güvenlik Başlıkları (certbot sonrası HTTPS bloğunda da geçerli kalır)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # Excel/CSV içe aktarma için maksimum gövde boyutu
    client_max_body_size 12M;

    # Fastify Yerel Uygulamasına Yönlendirme (Port 3100)
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Zaman aşımları
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
