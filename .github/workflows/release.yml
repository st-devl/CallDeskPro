name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build & Package (Linux x64)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: node --import tsx --test test/**/*.test.ts

      - name: Build Web & Server
        run: npm run build

      - name: Package Distribution (Standalone Linux x64)
        run: |
          mkdir -p release-payload
          cp -r dist release-payload/
          cp -r deploy release-payload/
          cp -r samples release-payload/
          cp package.json package-lock.json .env.example README.md release-payload/

          # Production bağımlılıklarını hazırla
          cd release-payload
          npm ci --omit=dev --ignore-scripts
          # better-sqlite3 yerel binary'sini derle
          npm rebuild better-sqlite3
          cd ..

          tar -czf callcenter-release.tar.gz -C release-payload .
          echo "Paket boyutu: $(du -h callcenter-release.tar.gz | cut -f1)"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: callcenter-release
          path: callcenter-release.tar.gz

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: callcenter-release.tar.gz
          generate_release_notes: true
